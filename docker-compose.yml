services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: saatavat
      POSTGRES_USER: saatavat
      POSTGRES_PASSWORD: saatavat
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U saatavat -d saatavat"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build: .
    command: php -S 0.0.0.0:8080 -t public
    working_dir: /app
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: saatavat
      DB_USER: saatavat
      DB_PASSWORD: saatavat
      APP_DEBUG: "true"
    ports:
      - "8080:8080"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
